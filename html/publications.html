<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>名村 憲尚 (Norihisa Namura)</title>
<link rel="stylesheet" href="/style.css">
<script src="/utils.js"></script>
</head>

<body>
<script>
document.addEventListener("DOMContentLoaded", function() {
includeHTML("#header", "/html/header.html");
});
document.addEventListener("DOMContentLoaded", function() {
includeHTML("#footer", "/html/footer.html");
});
</script>

<div id="header"></div>

<main>
<h1 style="text-align: center;">Publications</h1>

<!-- Preprints -->
<div id="arXiv">
<h2> Preprints </h2>
<script>
loadBib("/references/arXiv.bib").then(bibtexText => {
    main(bibtexText, "arXiv")
});
</script>
</div>

<!-- Journal papers -->
<div id="journal_papers">
<h2> Journal papers </h2>
<h3> Refereed </h3>
<script>
loadBib("/references/journal_papers.bib").then(bibtexText => {
    main(bibtexText, "journal_papers")
});
</script>
</div>

<!-- Conference papers -->
<div id="conference_papers">
<h2> Conference papers </h2>
<h3> Refereed </h3>
<script>
loadBib("/references/conference_papers.bib").then(bibtexText => {
    main(bibtexText, "conference_papers")
});
</script>
</div>
</main>

<div id="footer"></div>
</body>
</html>
